-- AgentMeter desktop panel for Conky (1.10+), installed as
-- ~/.config/conky/agentmeter.conf. Start with: conky -c ~/.config/conky/agentmeter.conf
-- The cards are rendered by `agentmeter -render conky` (see render.go).
conky.config = {
	alignment = 'top_right',
	gap_x = 40,
	gap_y = 60,
	minimum_width = 290,
	maximum_width = 290,
	border_inner_margin = 14,

	own_window = true,
	own_window_type = 'desktop',
	own_window_class = 'AgentMeter',
	own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
	own_window_argb_visual = true,
	own_window_argb_value = 230,
	own_window_colour = '16161B',

	double_buffer = true,
	use_xft = true,
	font = 'Sans:size=10',
	default_color = 'BEBEC4',
	draw_shades = false,
	background = true,
	update_interval = 60,
}

conky.text = [[
${font Sans:bold:size=13}AgentMeter${font}
${color 28282E}${hr 1}${color}
${execpi 60 "$HOME/.agentmeter/run.sh" conky}
]]
