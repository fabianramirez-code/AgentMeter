[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseActionCursor=1
OnRefreshAction=[!CommandMeasure MeasureRun "Run"]

[Metadata]
Name=AgentMeter
Author=AgentMeter
Version=1.0.0
Information=Shows Claude, Codex and Gemini (Antigravity) subscription quota usage.
License=MIT

[Variables]
Scale=1.0
Transparency=10
WindowAlpha=230
EnableClaude=1
EnableCodex=1
EnableGemini=1
ActiveIndex=0
ActiveProviderName=Claude
ActiveProviderColor=#ColorClaude#
EnabledProviders=claude,codex,gemini
ShowSettings=0
ProcClaude=claude.exe
ProcCodex=codex.exe
ProcGemini=agy.exe
FallbackMinutes=20
; Decimal R,G,B (not hex): these are always combined with a comma-joined
; alpha, e.g. "Stroke Color #ActiveProviderColor#,#WindowAlpha#" -- mixing
; a hex string into that comma list makes Rainmeter's color parser fail
; and silently fall back to a default color.
ColorClaude=232,102,74
ColorCodex=46,191,165
ColorGemini=74,144,226
ColorAmber=242,169,59
; Usage traffic light: card color by used %, thresholds are inclusive.
WarnPct=60
CritPct=85
ColorOk=205,205,212
ColorWarn=242,201,76
ColorCrit=232,80,70
C1Color=205,205,212
C2Color=205,205,212
C3Color=205,205,212
; Cards scroll area: ScrollY is the current scroll offset (unscaled px, not
; persisted); MaxScroll is 0 unless the active provider has a third card
; (set by MeasureHasC3 below).
ScrollY=0
MaxScroll=0
; Card dot: green while the provider CLI process is running, gray otherwise.
ColorActive=76,201,120
ColorIdle=110,110,118
DotColor=110,110,118
GlyphUp=▲
GlyphDown=▼
GlyphGear=⚙

; ----------------------------------------------------------------------
; Control logic: provider cycling + settings panel. Lua instead of long
; bang chains because cycling only ENABLED providers, and clamping the
; transparency/size sliders, both need small loops/conditionals.
[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\AgentMeter.lua
UpdateDivider=-1

; One-shot exe poll: once on load (OnRefreshAction above) and every 60s.
; RunCommand only executes via an explicit "Run" bang, never on its own
; Update/UpdateDivider cycle, so a Calc counter drives the 60s cadence.
; Traffic light: picks C1Color/C2Color from the active provider's used %.
[MeasureC1Level]
Measure=Calc
Formula=[Measure#ActiveProviderName#C1Pct:]
DynamicVariables=1
IfCondition=MeasureC1Level >= #CritPct#
IfTrueAction=[!SetVariable C1Color "#ColorCrit#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition2=(MeasureC1Level >= #WarnPct#) && (MeasureC1Level < #CritPct#)
IfTrueAction2=[!SetVariable C1Color "#ColorWarn#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition3=MeasureC1Level < #WarnPct#
IfTrueAction3=[!SetVariable C1Color "#ColorOk#"][!UpdateMeterGroup Cards][!Redraw]

[MeasureC2Level]
Measure=Calc
Formula=[Measure#ActiveProviderName#C2Pct:]
DynamicVariables=1
IfCondition=MeasureC2Level >= #CritPct#
IfTrueAction=[!SetVariable C2Color "#ColorCrit#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition2=(MeasureC2Level >= #WarnPct#) && (MeasureC2Level < #CritPct#)
IfTrueAction2=[!SetVariable C2Color "#ColorWarn#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition3=MeasureC2Level < #WarnPct#
IfTrueAction3=[!SetVariable C2Color "#ColorOk#"][!UpdateMeterGroup Cards][!Redraw]

[MeasureC3Level]
Measure=Calc
Formula=[Measure#ActiveProviderName#C3Pct:]
DynamicVariables=1
IfCondition=MeasureC3Level >= #CritPct#
IfTrueAction=[!SetVariable C3Color "#ColorCrit#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition2=(MeasureC3Level >= #WarnPct#) && (MeasureC3Level < #CritPct#)
IfTrueAction2=[!SetVariable C3Color "#ColorWarn#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition3=MeasureC3Level < #WarnPct#
IfTrueAction3=[!SetVariable C3Color "#ColorOk#"][!UpdateMeterGroup Cards][!Redraw]

; Hides/shows the third card + scrollbar based on whether the active
; provider's C3Label is empty, and resets MaxScroll/ScrollY accordingly.
[MeasureHasC3]
Measure=String
String=[Measure#ActiveProviderName#C3Label]
DynamicVariables=1
IfMatch=^$
IfMatchMode=1
IfMatchAction=[!SetVariable MaxScroll 0][!SetVariable ScrollY 0][!HideMeterGroup Card3][!UpdateMeterGroup Cards][!Redraw]
IfNotMatchAction=[!SetVariable MaxScroll 128][!ShowMeterGroup Card3][!UpdateMeterGroup Cards][!Redraw]

[MeasureClock]
Measure=Calc
Formula=Counter
UpdateDivider=60
OnUpdateAction=[!CommandMeasure MeasureRun "Run"]

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program=#@#agentmeter.exe
Parameter="-out ""#@#data.json"" -state ""#@#state.json"" -providers ""#EnabledProviders#"" -procs ""claude=#ProcClaude#;codex=#ProcCodex#;gemini=#ProcGemini#"" -fallback #FallbackMinutes#"
State=Hide
OutputType=ANSI
UpdateDivider=-1
; WebParser "Update" parses in a background thread, so the children and
; meters are refreshed from MeasureData's own FinishAction (fires once the
; parse is done), not here: updating them here reads the previous values.
FinishAction=[!CommandMeasure MeasureData "Update"]

; Single parent parse of data.json; children below just index into it
; (StringIndex) instead of each re-reading/re-matching the file.
[MeasureClaudeActive]
Measure=WebParser
URL=[MeasureData]
StringIndex=1
UpdateDivider=-1
Group=DataChildren
[MeasureCodexActive]
Measure=WebParser
URL=[MeasureData]
StringIndex=11
UpdateDivider=-1
Group=DataChildren
[MeasureGeminiActive]
Measure=WebParser
URL=[MeasureData]
StringIndex=21
UpdateDivider=-1
Group=DataChildren

[MeasureDotState]
Measure=Calc
Formula=[Measure#ActiveProviderName#Active:]
DynamicVariables=1
IfCondition=MeasureDotState = 1
IfTrueAction=[!SetVariable DotColor "#ColorActive#"][!UpdateMeterGroup Cards][!Redraw]
IfFalseAction=[!SetVariable DotColor "#ColorIdle#"][!UpdateMeterGroup Cards][!Redraw]

[MeasureData]
Measure=WebParser
URL=file://#@#data.json
RegExp=(?siU)"claude_active":\s*"([^"]*)".*"claude_c1_label":\s*"([^"]*)".*"claude_c1_pct":\s*"([^"]*)".*"claude_c1_reset":\s*"([^"]*)".*"claude_c2_label":\s*"([^"]*)".*"claude_c2_pct":\s*"([^"]*)".*"claude_c2_reset":\s*"([^"]*)".*"claude_c3_label":\s*"([^"]*)".*"claude_c3_pct":\s*"([^"]*)".*"claude_c3_reset":\s*"([^"]*)".*"codex_active":\s*"([^"]*)".*"codex_c1_label":\s*"([^"]*)".*"codex_c1_pct":\s*"([^"]*)".*"codex_c1_reset":\s*"([^"]*)".*"codex_c2_label":\s*"([^"]*)".*"codex_c2_pct":\s*"([^"]*)".*"codex_c2_reset":\s*"([^"]*)".*"codex_c3_label":\s*"([^"]*)".*"codex_c3_pct":\s*"([^"]*)".*"codex_c3_reset":\s*"([^"]*)".*"gemini_active":\s*"([^"]*)".*"gemini_c1_label":\s*"([^"]*)".*"gemini_c1_pct":\s*"([^"]*)".*"gemini_c1_reset":\s*"([^"]*)".*"gemini_c2_label":\s*"([^"]*)".*"gemini_c2_pct":\s*"([^"]*)".*"gemini_c2_reset":\s*"([^"]*)".*"gemini_c3_label":\s*"([^"]*)".*"gemini_c3_pct":\s*"([^"]*)".*"gemini_c3_reset":\s*"([^"]*)"
StringIndex=1
UpdateDivider=-1
FinishAction=[!UpdateMeasureGroup DataChildren][!UpdateMeterGroup Cards][!Redraw]

[MeasureClaudeC1Label]
Measure=WebParser
URL=[MeasureData]
StringIndex=2
UpdateDivider=-1
Group=DataChildren
[MeasureClaudeC1Pct]
Measure=WebParser
