; ----------------------------------------------------------------------
; Card 3: only the active provider's third window (e.g. Claude's "Fable"
; weekly limit). Hidden/shown by MeasureHasC3 above, which also resets
; MaxScroll/ScrollY. Group=Cards|Card3 so provider-switch group updates
; (!UpdateMeterGroup Cards) still refresh it while it stays hidden.
[MeterC3Border]
Meter=Shape
Group=Cards|Card3
Container=MeterCardsContainer
