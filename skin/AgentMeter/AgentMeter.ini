X=(32*#Scale#)
Y=((230-#ScrollY#)*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=180,180,188,255
AntiAlias=1
Text="%1"
DynamicVariables=1

[MeterC3Dot]
