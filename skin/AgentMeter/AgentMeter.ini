Meter=String
Group=Cards
MeasureName=Measure#ActiveProviderName#C2Reset
X=(288*#Scale#)
Y=(222*#Scale#)
W=(256*#Scale#)
StringAlign=Right
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=190,190,198,255
AntiAlias=1
Text="%1"
DynamicVariables=1

; ----------------------------------------------------------------------
; Settings panel (hidden by default; toggled by the gear icon). Occupies
; the same area as the cards, swapped in/out via Hide/ShowMeterGroup.
[MeterSettingsTitle]
Meter=String
Group=Settings
Hidden=1
X=(16*#Scale#)
Y=(44*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=190,190,196,255
AntiAlias=1
Text="Providers"
DynamicVariables=1

[MeasureCheckClaude]
Measure=Calc
Formula=#EnableClaude#
Substitute="1":"☑","0":"☐"
UpdateDivider=-1

[MeterSettingsClaudeBox]
Meter=String
Group=Settings
Hidden=1
X=(16*#Scale#)
Y=(70*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=230,230,235,255
AntiAlias=1
