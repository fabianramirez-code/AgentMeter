Meter=String
Group=Settings
Hidden=1
X=(16*#Scale#)
Y=(44*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=190,190,196,255
AntiAlias=1
Text="Providers"
DynamicVariables=1

[MeasureCheckClaude]
Measure=Calc
Formula=#EnableClaude#
Substitute="1":"☑","0":"☐"
UpdateDivider=-1

[MeterSettingsClaudeBox]
Meter=String
Group=Settings
Hidden=1
X=(16*#Scale#)
Y=(70*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=230,230,235,255
