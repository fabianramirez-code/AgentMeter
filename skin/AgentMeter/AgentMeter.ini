; Thin scrollbar on the right edge of the clipped area; cards' right edge
; is 16+288=304, so x=310 fits inside the 320 width. These Y values are
; fixed within the container (not offset by ScrollY) since the track and
; thumb must stay put while the cards scroll underneath them.
[MeterCardsScrollTrack]
Meter=Shape
Group=Cards|Card3
Container=MeterCardsContainer
Shape=Rectangle (310*#Scale#),0,(4*#Scale#),(212*#Scale#),(2*#Scale#) | Fill Color 44,44,52,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1
LeftMouseUpAction=[!CommandMeasure MeasureScript "ScrollToggle()"]

[MeterCardsScrollThumb]
Meter=Shape
Group=Cards|Card3
Container=MeterCardsContainer
Shape=Rectangle (310*#Scale#),((#ScrollY#*212/340)*#Scale#),(4*#Scale#),((212*212/340)*#Scale#),(2*#Scale#) | Fill Color #ActiveProviderColor#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1
LeftMouseUpAction=[!CommandMeasure MeasureScript "ScrollToggle()"]

; ----------------------------------------------------------------------
; Settings panel (hidden by default; toggled by the gear icon). Occupies
; the same area as the cards, swapped in/out via Hide/ShowMeterGroup.
