; ----------------------------------------------------------------------
; Background panel (320 x 272 base)
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,(320*#Scale#),(272*#Scale#),(14*#Scale#) | Fill Color 22,22,27,#WindowAlpha# | StrokeWidth (1*#Scale#) | Stroke Color 40,40,46,#WindowAlpha#
DynamicVariables=1
UpdateDivider=-1
MouseScrollDownAction=[!CommandMeasure MeasureScript "Scroll(1)"]
MouseScrollUpAction=[!CommandMeasure MeasureScript "Scroll(-1)"]

; Header: "AgentMeter / <Provider>" left, ▲▼⚙ right, separator below.
[MeterHeaderLabel]
Meter=String
StringStyle=Bold
X=(16*#Scale#)
Y=(10*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=190,190,196,255
AntiAlias=1
Text="AgentMeter /"
DynamicVariables=1

[MeterHeaderProvider]
Meter=String
StringStyle=Bold
X=(5*#Scale#)R
Y=0r
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=#ActiveProviderColor#,255
AntiAlias=1
Text="#ActiveProviderName#"
DynamicVariables=1

[MeterNavUp]
Meter=String
X=(244*#Scale#)
Y=(10*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=170,170,178,255
AntiAlias=1
Text="#GlyphUp#"
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureScript "CycleProvider(-1)"]

[MeterNavDown]
Meter=String
X=(266*#Scale#)
Y=(10*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=170,170,178,255
AntiAlias=1
Text="#GlyphDown#"
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureScript "CycleProvider(1)"]

[MeterGear]
Meter=String
X=(288*#Scale#)
Y=(9*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=170,170,178,255
AntiAlias=1
Text="#GlyphGear#"
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureScript "if tonumber(SKIN:GetVariable('ShowSettings')) ~= 1 then ToggleSettings() end"]

[MeterHeaderSeparator]
Meter=Shape
Shape=Rectangle (16*#Scale#),(38*#Scale#),(288*#Scale#),1 | Fill Color 40,40,46,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

; ----------------------------------------------------------------------
; Cards 1-3 (provider accent, amber, and the optional "Fable"-style third
; card) are generic: MeasureName targets "Measure<ActiveProviderName>C1..."
; and re-resolves on provider change via DynamicVariables, so only ONE set
; of card meters is needed instead of one per provider.
;
; They all live inside MeterCardsContainer, which clips them to the fixed
; 320x272 background (y 44..256) so a third card doesn't grow the widget;
; the user scrolls it into view instead (see Scroll() in the Lua script).
; Meters with Container=X are positioned relative to the container's own
; top-left, so every card Y below is "(original_y - 44 - ScrollY) * Scale"
; instead of "original_y * Scale".

[MeterCardsContainer]
Meter=Shape
Group=Cards
; Contained meters are positioned relative to this meter's X/Y, so the
; clip origin must be the meter position itself, not an offset inside Shape.
X=0
Y=(44*#Scale#)
Shape=Rectangle 0,0,(320*#Scale#),(212*#Scale#)
DynamicVariables=1
UpdateDivider=-1

[MeterC1Border]
Meter=Shape
Group=Cards
Container=MeterCardsContainer
Shape=Rectangle (16*#Scale#),((0-#ScrollY#)*#Scale#),(288*#Scale#),(100*#Scale#),(10*#Scale#) | Fill Color 26,26,32,#WindowAlpha# | StrokeWidth (1.5*#Scale#) | Stroke Color #C1Color#,#WindowAlpha#
DynamicVariables=1
UpdateDivider=-1

[MeterC1Label]
Meter=String
Group=Cards
Container=MeterCardsContainer
MeasureName=Measure#ActiveProviderName#C1Label
X=(32*#Scale#)
Y=((6-#ScrollY#)*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=180,180,188,255
AntiAlias=1
Text="%1"
DynamicVariables=1

[MeterC1Dot]
Meter=Shape
Group=Cards
Container=MeterCardsContainer
Shape=Ellipse (288*#Scale#),((16-#ScrollY#)*#Scale#),(6*#Scale#),(6*#Scale#) | Fill Color #DotColor#,90 | StrokeWidth 0
Shape2=Ellipse (288*#Scale#),((16-#ScrollY#)*#Scale#),(3*#Scale#),(3*#Scale#) | Fill Color #DotColor#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC1Pct]
Meter=String
Group=Cards
Container=MeterCardsContainer
MeasureName=Measure#ActiveProviderName#C1Pct
X=(32*#Scale#)
Y=((28-#ScrollY#)*#Scale#)
FontFace=Segoe UI
FontSize=(26*#Scale#)
StringStyle=Bold
FontColor=#C1Color#,255
AntiAlias=1
Text="%1%"
DynamicVariables=1

; Track and fill are two meters, not one Shape/Shape2 combo: %1 (the
; measure value) only substitutes into a meter's own first Shape option,
; so a shared-measure Shape2 fill never got the live percentage.
[MeterC1BarTrack]
Meter=Shape
Group=Cards
Container=MeterCardsContainer
Shape=Rectangle (110*#Scale#),((46-#ScrollY#)*#Scale#),(178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color 44,44,52,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC1BarFill]
Meter=Shape
Group=Cards
Container=MeterCardsContainer
Shape=Rectangle (110*#Scale#),((46-#ScrollY#)*#Scale#),((Clamp([Measure#ActiveProviderName#C1Pct],0,100)/100)*178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color #C1Color#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC1Reset]
ClipString=1
Meter=String
Group=Cards
Container=MeterCardsContainer
MeasureName=Measure#ActiveProviderName#C1Reset
X=(288*#Scale#)
Y=((66-#ScrollY#)*#Scale#)
W=(256*#Scale#)
StringAlign=Right
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=190,190,198,255
AntiAlias=1
Text="%1"
DynamicVariables=1

[MeterC2Border]
Meter=Shape
Group=Cards
Container=MeterCardsContainer
Shape=Rectangle (16*#Scale#),((112-#ScrollY#)*#Scale#),(288*#Scale#),(100*#Scale#),(10*#Scale#) | Fill Color 26,26,32,#WindowAlpha# | StrokeWidth (1.5*#Scale#) | Stroke Color #C2Color#,#WindowAlpha#
DynamicVariables=1
UpdateDivider=-1

[MeterC2Label]
Meter=String
Group=Cards
Container=MeterCardsContainer
MeasureName=Measure#ActiveProviderName#C2Label
X=(32*#Scale#)
Y=((118-#ScrollY#)*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=180,180,188,255
AntiAlias=1
Text="%1"
DynamicVariables=1

[MeterC2Dot]
Meter=Shape
Group=Cards
Container=MeterCardsContainer
Shape=Ellipse (288*#Scale#),((128-#ScrollY#)*#Scale#),(6*#Scale#),(6*#Scale#) | Fill Color #DotColor#,90 | StrokeWidth 0
Shape2=Ellipse (288*#Scale#),((128-#ScrollY#)*#Scale#),(3*#Scale#),(3*#Scale#) | Fill Color #DotColor#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC2Pct]
Meter=String
Group=Cards
Container=MeterCardsContainer
MeasureName=Measure#ActiveProviderName#C2Pct
X=(32*#Scale#)
Y=((140-#ScrollY#)*#Scale#)
FontFace=Segoe UI
FontSize=(26*#Scale#)
StringStyle=Bold
FontColor=#C2Color#,255
AntiAlias=1
Text="%1%"
DynamicVariables=1

[MeterC2BarTrack]
Meter=Shape
Group=Cards
Container=MeterCardsContainer
Shape=Rectangle (110*#Scale#),((158-#ScrollY#)*#Scale#),(178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color 44,44,52,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC2BarFill]
Meter=Shape
Group=Cards
Container=MeterCardsContainer
Shape=Rectangle (110*#Scale#),((158-#ScrollY#)*#Scale#),((Clamp([Measure#ActiveProviderName#C2Pct],0,100)/100)*178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color #C2Color#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC2Reset]
ClipString=1
Meter=String
Group=Cards
Container=MeterCardsContainer
MeasureName=Measure#ActiveProviderName#C2Reset
X=(288*#Scale#)
Y=((178-#ScrollY#)*#Scale#)
W=(256*#Scale#)
StringAlign=Right
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=190,190,198,255
AntiAlias=1
Text="%1"
