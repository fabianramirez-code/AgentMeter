Container=MeterCardsContainer
Shape=Rectangle (110*#Scale#),((270-#ScrollY#)*#Scale#),((Clamp([Measure#ActiveProviderName#C3Pct],0,100)/100)*178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color #C3Color#,255 | StrokeWidth 0
