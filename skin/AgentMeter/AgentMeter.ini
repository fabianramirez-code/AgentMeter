[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseActionCursor=1
OnRefreshAction=[!CommandMeasure MeasureRun "Run"]

[Metadata]
Name=AgentMeter
Author=AgentMeter
Version=1.0.0
Information=Shows Claude, Codex and Gemini (Antigravity) subscription quota usage.
License=MIT

[Variables]
Scale=1.0
Transparency=10
WindowAlpha=230
EnableClaude=1
EnableCodex=1
EnableGemini=1
ActiveIndex=0
ActiveProviderName=Claude
ActiveProviderColor=#ColorClaude#
EnabledProviders=claude,codex,gemini
ShowSettings=0
ProcClaude=claude.exe
ProcCodex=codex.exe
ProcGemini=agy.exe
FallbackMinutes=20
; Decimal R,G,B (not hex): these are always combined with a comma-joined
; alpha, e.g. "Stroke Color #ActiveProviderColor#,#WindowAlpha#" -- mixing
; a hex string into that comma list makes Rainmeter's color parser fail
; and silently fall back to a default color.
ColorClaude=232,102,74
ColorCodex=46,191,165
ColorGemini=74,144,226
ColorAmber=242,169,59
; Usage traffic light: card color by used %, thresholds are inclusive.
WarnPct=60
CritPct=85
ColorOk=205,205,212
ColorWarn=242,201,76
ColorCrit=232,80,70
C1Color=205,205,212
C2Color=205,205,212
; Card dot: green while the provider CLI process is running, gray otherwise.
ColorActive=76,201,120
ColorIdle=110,110,118
DotColor=110,110,118
DotTip=Not active
GlyphUp=▲
GlyphDown=▼
GlyphGear=⚙

; ----------------------------------------------------------------------
; Control logic: provider cycling + settings panel. Lua instead of long
; bang chains because cycling only ENABLED providers, and clamping the
; transparency/size sliders, both need small loops/conditionals.
[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\AgentMeter.lua
UpdateDivider=-1

; One-shot exe poll: once on load (OnRefreshAction above) and every 60s.
; RunCommand only executes via an explicit "Run" bang, never on its own
; Update/UpdateDivider cycle, so a Calc counter drives the 60s cadence.
; Traffic light: picks C1Color/C2Color from the active provider's used %.
[MeasureC1Level]
Measure=Calc
Formula=[Measure#ActiveProviderName#C1Pct:]
DynamicVariables=1
IfCondition=MeasureC1Level >= #CritPct#
IfTrueAction=[!SetVariable C1Color "#ColorCrit#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition2=(MeasureC1Level >= #WarnPct#) && (MeasureC1Level < #CritPct#)
IfTrueAction2=[!SetVariable C1Color "#ColorWarn#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition3=MeasureC1Level < #WarnPct#
IfTrueAction3=[!SetVariable C1Color "#ColorOk#"][!UpdateMeterGroup Cards][!Redraw]

[MeasureC2Level]
Measure=Calc
Formula=[Measure#ActiveProviderName#C2Pct:]
DynamicVariables=1
IfCondition=MeasureC2Level >= #CritPct#
IfTrueAction=[!SetVariable C2Color "#ColorCrit#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition2=(MeasureC2Level >= #WarnPct#) && (MeasureC2Level < #CritPct#)
IfTrueAction2=[!SetVariable C2Color "#ColorWarn#"][!UpdateMeterGroup Cards][!Redraw]
IfCondition3=MeasureC2Level < #WarnPct#
IfTrueAction3=[!SetVariable C2Color "#ColorOk#"][!UpdateMeterGroup Cards][!Redraw]

[MeasureClock]
Measure=Calc
Formula=Counter
UpdateDivider=60
OnUpdateAction=[!CommandMeasure MeasureRun "Run"]

[MeasureRun]
Measure=Plugin
Plugin=RunCommand
Program=#@#agentmeter.exe
Parameter="-out ""#@#data.json"" -state ""#@#state.json"" -providers ""#EnabledProviders#"" -procs ""claude=#ProcClaude#;codex=#ProcCodex#;gemini=#ProcGemini#"" -fallback #FallbackMinutes#"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!CommandMeasure MeasureData "Update"][!UpdateMeasureGroup DataChildren][!UpdateMeterGroup Cards][!Redraw]

; Single parent parse of data.json; children below just index into it
; (StringIndex) instead of each re-reading/re-matching the file.
[MeasureClaudeActive]
Measure=WebParser
URL=[MeasureData]
StringIndex=1
UpdateDivider=-1
Group=DataChildren
[MeasureCodexActive]
Measure=WebParser
URL=[MeasureData]
StringIndex=8
UpdateDivider=-1
Group=DataChildren
[MeasureGeminiActive]
Measure=WebParser
URL=[MeasureData]
StringIndex=15
UpdateDivider=-1
Group=DataChildren

[MeasureDotState]
Measure=Calc
Formula=[Measure#ActiveProviderName#Active:]
DynamicVariables=1
IfCondition=MeasureDotState = 1
IfTrueAction=[!SetVariable DotColor "#ColorActive#"][!SetVariable DotTip "Active"][!UpdateMeterGroup Cards][!Redraw]
IfFalseAction=[!SetVariable DotColor "#ColorIdle#"][!SetVariable DotTip "Not active"][!UpdateMeterGroup Cards][!Redraw]

[MeasureData]
Measure=WebParser
URL=file://#@#data.json
RegExp=(?siU)"claude_active":\s*"([^"]*)".*"claude_c1_label":\s*"([^"]*)".*"claude_c1_pct":\s*"([^"]*)".*"claude_c1_reset":\s*"([^"]*)".*"claude_c2_label":\s*"([^"]*)".*"claude_c2_pct":\s*"([^"]*)".*"claude_c2_reset":\s*"([^"]*)".*"codex_active":\s*"([^"]*)".*"codex_c1_label":\s*"([^"]*)".*"codex_c1_pct":\s*"([^"]*)".*"codex_c1_reset":\s*"([^"]*)".*"codex_c2_label":\s*"([^"]*)".*"codex_c2_pct":\s*"([^"]*)".*"codex_c2_reset":\s*"([^"]*)".*"gemini_active":\s*"([^"]*)".*"gemini_c1_label":\s*"([^"]*)".*"gemini_c1_pct":\s*"([^"]*)".*"gemini_c1_reset":\s*"([^"]*)".*"gemini_c2_label":\s*"([^"]*)".*"gemini_c2_pct":\s*"([^"]*)".*"gemini_c2_reset":\s*"([^"]*)"
StringIndex=1
UpdateDivider=-1

[MeasureClaudeC1Label]
Measure=WebParser
URL=[MeasureData]
StringIndex=2
UpdateDivider=-1
Group=DataChildren
[MeasureClaudeC1Pct]
Measure=WebParser
URL=[MeasureData]
StringIndex=3
UpdateDivider=-1
Group=DataChildren
[MeasureClaudeC1Reset]
Measure=WebParser
URL=[MeasureData]
StringIndex=4
UpdateDivider=-1
Group=DataChildren
[MeasureClaudeC2Label]
Measure=WebParser
URL=[MeasureData]
StringIndex=5
UpdateDivider=-1
Group=DataChildren
[MeasureClaudeC2Pct]
Measure=WebParser
URL=[MeasureData]
StringIndex=6
UpdateDivider=-1
Group=DataChildren
[MeasureClaudeC2Reset]
Measure=WebParser
URL=[MeasureData]
StringIndex=7
UpdateDivider=-1
Group=DataChildren

[MeasureCodexC1Label]
Measure=WebParser
URL=[MeasureData]
StringIndex=9
UpdateDivider=-1
Group=DataChildren
[MeasureCodexC1Pct]
Measure=WebParser
URL=[MeasureData]
StringIndex=10
UpdateDivider=-1
Group=DataChildren
[MeasureCodexC1Reset]
Measure=WebParser
URL=[MeasureData]
StringIndex=11
UpdateDivider=-1
Group=DataChildren
[MeasureCodexC2Label]
Measure=WebParser
URL=[MeasureData]
StringIndex=12
UpdateDivider=-1
Group=DataChildren
[MeasureCodexC2Pct]
Measure=WebParser
URL=[MeasureData]
StringIndex=13
UpdateDivider=-1
Group=DataChildren
[MeasureCodexC2Reset]
Measure=WebParser
URL=[MeasureData]
StringIndex=14
UpdateDivider=-1
Group=DataChildren

[MeasureGeminiC1Label]
Measure=WebParser
URL=[MeasureData]
StringIndex=16
UpdateDivider=-1
Group=DataChildren
[MeasureGeminiC1Pct]
Measure=WebParser
URL=[MeasureData]
StringIndex=17
UpdateDivider=-1
Group=DataChildren
[MeasureGeminiC1Reset]
Measure=WebParser
URL=[MeasureData]
StringIndex=18
UpdateDivider=-1
Group=DataChildren
[MeasureGeminiC2Label]
Measure=WebParser
URL=[MeasureData]
StringIndex=19
UpdateDivider=-1
Group=DataChildren
[MeasureGeminiC2Pct]
Measure=WebParser
URL=[MeasureData]
StringIndex=20
UpdateDivider=-1
Group=DataChildren
[MeasureGeminiC2Reset]
Measure=WebParser
URL=[MeasureData]
StringIndex=21
UpdateDivider=-1
Group=DataChildren

; ----------------------------------------------------------------------
; Background panel (320 x 272 base)
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,(320*#Scale#),(272*#Scale#),(14*#Scale#) | Fill Color 22,22,27,#WindowAlpha# | StrokeWidth (1*#Scale#) | Stroke Color 40,40,46,#WindowAlpha#
DynamicVariables=1
UpdateDivider=-1

; Header: "AgentMeter / <Provider>" left, ▲▼⚙ right, separator below.
[MeterHeaderLabel]
Meter=String
StringStyle=Bold
X=(16*#Scale#)
Y=(10*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=190,190,196,255
AntiAlias=1
Text="AgentMeter /"
DynamicVariables=1

[MeterHeaderProvider]
Meter=String
StringStyle=Bold
X=(5*#Scale#)R
Y=0r
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=#ActiveProviderColor#,255
AntiAlias=1
Text="#ActiveProviderName#"
DynamicVariables=1

[MeterNavUp]
Meter=String
X=(244*#Scale#)
Y=(10*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=170,170,178,255
AntiAlias=1
Text="#GlyphUp#"
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureScript "CycleProvider(-1)"]

[MeterNavDown]
Meter=String
X=(266*#Scale#)
Y=(10*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=170,170,178,255
AntiAlias=1
Text="#GlyphDown#"
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureScript "CycleProvider(1)"]

[MeterGear]
Meter=String
X=(288*#Scale#)
Y=(9*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=170,170,178,255
AntiAlias=1
Text="#GlyphGear#"
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureScript "if tonumber(SKIN:GetVariable('ShowSettings')) ~= 1 then ToggleSettings() end"]

[MeterHeaderSeparator]
Meter=Shape
Shape=Rectangle (16*#Scale#),(38*#Scale#),(288*#Scale#),1 | Fill Color 40,40,46,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

; ----------------------------------------------------------------------
; Card 1 (top, provider accent color) and Card 2 (bottom, amber). Both
; are generic: MeasureName targets "Measure<ActiveProviderName>C1..." and
; re-resolves on provider change via DynamicVariables, so only ONE pair
; of card meters is needed instead of one set per provider.

[MeterC1Border]
Meter=Shape
Group=Cards
Shape=Rectangle (16*#Scale#),(44*#Scale#),(288*#Scale#),(100*#Scale#),(10*#Scale#) | Fill Color 26,26,32,#WindowAlpha# | StrokeWidth (1.5*#Scale#) | Stroke Color #C1Color#,#WindowAlpha#
DynamicVariables=1
UpdateDivider=-1

[MeterC1Label]
Meter=String
Group=Cards
MeasureName=Measure#ActiveProviderName#C1Label
X=(32*#Scale#)
Y=(50*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=180,180,188,255
AntiAlias=1
Text="%1"
DynamicVariables=1

[MeterC1Dot]
Meter=Shape
Group=Cards
Shape=Ellipse (288*#Scale#),(60*#Scale#),(6*#Scale#),(6*#Scale#) | Fill Color #DotColor#,90 | StrokeWidth 0
Shape2=Ellipse (288*#Scale#),(60*#Scale#),(3*#Scale#),(3*#Scale#) | Fill Color #DotColor#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1
; Invisible larger ellipse (alpha 1) so the tiny dot is easy to hover.
Shape3=Ellipse (288*#Scale#),(60*#Scale#),(11*#Scale#),(11*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
ToolTipText=#DotTip#

[MeterC1Pct]
Meter=String
Group=Cards
MeasureName=Measure#ActiveProviderName#C1Pct
X=(32*#Scale#)
Y=(72*#Scale#)
FontFace=Segoe UI
FontSize=(26*#Scale#)
StringStyle=Bold
FontColor=#C1Color#,255
AntiAlias=1
Text="%1%"
DynamicVariables=1

; Track and fill are two meters, not one Shape/Shape2 combo: %1 (the
; measure value) only substitutes into a meter's own first Shape option,
; so a shared-measure Shape2 fill never got the live percentage.
[MeterC1BarTrack]
Meter=Shape
Group=Cards
Shape=Rectangle (110*#Scale#),(90*#Scale#),(178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color 44,44,52,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC1BarFill]
Meter=Shape
Group=Cards
Shape=Rectangle (110*#Scale#),(90*#Scale#),((Clamp([Measure#ActiveProviderName#C1Pct],0,100)/100)*178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color #C1Color#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC1Reset]
ClipString=1
Meter=String
Group=Cards
MeasureName=Measure#ActiveProviderName#C1Reset
X=(288*#Scale#)
Y=(110*#Scale#)
W=(256*#Scale#)
StringAlign=Right
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=190,190,198,255
AntiAlias=1
Text="%1"
DynamicVariables=1

[MeterC2Border]
Meter=Shape
Group=Cards
Shape=Rectangle (16*#Scale#),(156*#Scale#),(288*#Scale#),(100*#Scale#),(10*#Scale#) | Fill Color 26,26,32,#WindowAlpha# | StrokeWidth (1.5*#Scale#) | Stroke Color #C2Color#,#WindowAlpha#
DynamicVariables=1
UpdateDivider=-1

[MeterC2Label]
Meter=String
Group=Cards
MeasureName=Measure#ActiveProviderName#C2Label
X=(32*#Scale#)
Y=(162*#Scale#)
FontFace=Segoe UI
FontSize=(13*#Scale#)
FontColor=180,180,188,255
AntiAlias=1
Text="%1"
DynamicVariables=1

[MeterC2Dot]
Meter=Shape
Group=Cards
Shape=Ellipse (288*#Scale#),(172*#Scale#),(6*#Scale#),(6*#Scale#) | Fill Color #DotColor#,90 | StrokeWidth 0
Shape2=Ellipse (288*#Scale#),(172*#Scale#),(3*#Scale#),(3*#Scale#) | Fill Color #DotColor#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1
; Invisible larger ellipse (alpha 1) so the tiny dot is easy to hover.
Shape3=Ellipse (288*#Scale#),(172*#Scale#),(11*#Scale#),(11*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
ToolTipText=#DotTip#

[MeterC2Pct]
Meter=String
Group=Cards
MeasureName=Measure#ActiveProviderName#C2Pct
X=(32*#Scale#)
Y=(184*#Scale#)
FontFace=Segoe UI
FontSize=(26*#Scale#)
StringStyle=Bold
FontColor=#C2Color#,255
AntiAlias=1
Text="%1%"
DynamicVariables=1

[MeterC2BarTrack]
Meter=Shape
Group=Cards
Shape=Rectangle (110*#Scale#),(202*#Scale#),(178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color 44,44,52,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC2BarFill]
Meter=Shape
Group=Cards
Shape=Rectangle (110*#Scale#),(202*#Scale#),((Clamp([Measure#ActiveProviderName#C2Pct],0,100)/100)*178*#Scale#),(10*#Scale#),(5*#Scale#) | Fill Color #C2Color#,255 | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterC2Reset]
